<style id="composer-align">
/* ── ① 身体区不再把整块垂直居中：座位将占满，输入卡片贴到底部 ──────────────
   官方 hero 态靠 `justify-content:center` 把「大标题 + 工作区行 + 输入卡片」
   整块居中；对话态则是消息区 flex:1 把座位顶到底。改成 flex-start 后由 ② 让
   座位自己吃掉整个高度，两种状态下的滚动容器高度完全一致。 */
.patched [data-conversation-content][data-content-phase="hero"] > [data-conversation-scroll] {
  justify-content: flex-start;
}

/* ── ② 座位占满身体区（官方 hero 态是 flex:none，只占内容高） ────────────── */
.patched [data-conversation-content][data-content-phase="hero"] [data-composer-seat] {
  flex: 1 1 auto;
}

/* ── ③ 输入栈占满座位，并去掉 hero 专属的 32px 底距 ────────────────────────
   官方 hero 给栈 `padding-bottom:32px`，卡片因此离座位底边 32px；对话态没有
   这层底距。行距（hero 8px / 对话 6px）不动：卡片是栈的最后一个孩子，它上面的
   间距只影响工作区行，改它只会白白挪动上方内容。 */
.patched [data-conversation-content][data-content-phase="hero"] [data-composer-seat] :has([data-composer-card]):not(:has(> [data-composer-card])):not([data-slot]):not([data-chain-overlay-fallback]) {
  flex: 1 1 auto;
  min-height: 0;
  padding-bottom: 0;
}

/* ── ④ 新会话大标题吃掉上方余量，自己在余量里继续垂直居中 ──────────────────
   HeroShell 官方是 `height:100%`（父级高度自适应时等于 auto）。③ 之后父级
   高度变成定值，100% 会把栈撑破，所以显式改回 auto，再用 flex:1 1 0 让它吸掉
   座位里除「工作区行 + 输入行」之外的全部空间 —— 大标题因此仍停在原来的视线
   位置，工作区行和输入卡片一起落到窗口底部。 */
.patched [data-conversation-content][data-content-phase="hero"] [data-composer-seat] :has([data-composer-card]):not(:has(> [data-composer-card])):not([data-slot]):not([data-chain-overlay-fallback]) > *:first-child {
  flex: 1 1 0;
  height: auto;
  min-height: 0;
}

/* ── ⑤ 输入行补上对话态的 4px 底距（官方 hero 态是 0） ─────────────────────
   卡片底边 = 座位底边 - 4px，与对话态 `.yhfFVG_root{padding-bottom:4px}` 对齐。 */
.patched [data-conversation-content][data-content-phase="hero"] [data-composer-seat] *:has(> [data-composer-card]) {
  padding-bottom: 4px;
}

/* ── ⑥ 写字区取对话态高度 ─────────────────────────────────────────────────
   官方 hero 态 `.hero .input{min-height:52px}`，对话态是 36px —— 这是卡片
   比对话态高 16px 的唯一来源，也是「位置一样但框不一样高」的最后一块。 */
.patched [data-conversation-content][data-content-phase="hero"] [data-composer-input] {
  min-height: 36px;
}

/* ── ⑦ 输入行下方那条「用量行」的占位：无论有没有内容，都留出同样的高度 ──────
   对话态里，卡片的最后一个兄弟节点是 composer dock —— 里面是「tokens/s · 缓存命中」
   用量行和上下文计量表（`conversation.composer.dock`，compact 模式下由 StatsPills
   与 ContextMeter 填满）。它高 26px（padding-top 4px + 一行 22px），会把卡片整体
   顶高 26px；而新会话态的 dock 是空 div（官方 `.hero .dock:empty{display:none}`），
   高度 0 —— 这正是「新会话已经贴底、发消息后却又上移 26px」的来源。
   这里把 dock 的最小高度钉死在这 26px：有内容时它本来就是 26px（不变），
   没内容时（新会话、或对话刚发出还没产生用量）由 min-height 撑住同样的 26px，
   卡片因此永远落在同一个 y 上，空白就空着。 */
[data-conversation-content] [data-composer-seat] *:has(> [data-composer-card]) > *:last-child {
  display: flex;
  box-sizing: border-box;
  min-height: var(--dsh-composer-dock-height, 26px);
}
</style>

<script>
/* Measure the conversation composer once, then draw the same box on the two New
   Session panels. Nothing here feeds the assertions in verify-composer-align.mjs. */
const screenOf = (figure) => figure.querySelector('.screen');
const boxIn = (el, host) => {
  const r = el.getBoundingClientRect();
  const h = host.getBoundingClientRect();
  return { x: r.left - h.left, y: r.top - h.top, w: r.width, h: r.height };
};
const figureOf = (id) => document.querySelector('figure[data-id="' + id + '"]');
const targetScreen = screenOf(figureOf('target'));
const targetCard = targetScreen.querySelector('[data-composer-card]');
const target = boxIn(targetCard, targetScreen);

const overlay = (host, rect, className, label) => {
  const el = document.createElement('div');
  el.className = className;
  el.style.left = rect.x + 'px';
  el.style.top = rect.y + 'px';
  el.style.width = rect.w + 'px';
  el.style.height = rect.h + 'px';
  el.innerHTML = '<span>' + label + '</span>';
  host.appendChild(el);
};

for (const id of ['target', 'before', 'after']) {
  const screen = screenOf(figureOf(id));
  const card = screen.querySelector('[data-composer-card]');
  const actual = boxIn(card, screen);
  if (id === 'target') {
    overlay(screen, actual, 'actual good', '发送后输入框 = 目标');
    continue;
  }
  overlay(screen, target, 'ref', '发送后输入框的位置（目标）');
  overlay(screen, actual, 'actual', '新会话输入框 · 现在在这里');
}
</script>
